name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets missing — building a test APK only (no release). Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD under Settings → Secrets and variables → Actions."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/homme-release.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/homme-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android assembleClientRelease assembleAdminRelease --no-daemon
          cp android/app/build/outputs/apk/client/release/app-client-release.apk homme.apk
          cp android/app/build/outputs/apk/admin/release/app-admin-release.apk homme-admin.apk

      - name: Verify APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for f in homme.apk homme-admin.apk; do
            "$BT/apksigner" verify --verbose --print-certs "$f"
            "$BT/aapt2" dump badging "$f" | head -5
          done

      - uses: actions/upload-artifact@v4
        with:
          name: homme-apks
          path: |
            homme.apk
            homme-admin.apk

      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: HOMME Android v1.0.${{ github.run_number }}
          body: |
            - **homme.apk**: the HOMME app for clients
            - **homme-admin.apk**: HOMME Admin, Tash's dashboard

            Download on an Android phone, open it, and allow "Install unknown apps" if asked.
          files: |
            homme.apk
            homme-admin.apk
          make_latest: "true"
