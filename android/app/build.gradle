plugins {
    id "com.android.application"
}

def host = project.property("hommeHost")
def ciVersion = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace "llc.homme.app"
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode ciVersion
        versionName "1.0.${ciVersion}"

        manifestPlaceholders = [hostName: host]
        resValue "string", "asset_statements",
            "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${host}\\\"}}]"
    }

    // Two apps from one project: the client app and Tash's dashboard app.
    flavorDimensions = ["app"]
    productFlavors {
        client {
            dimension "app"
            applicationId "llc.homme.app"
            manifestPlaceholders = [launchUrl: "https://${host}/"]
            resValue "string", "app_name", "HOMME"
        }
        admin {
            dimension "app"
            applicationId "llc.homme.admin"
            manifestPlaceholders = [launchUrl: "https://${host}/admin"]
            resValue "string", "app_name", "HOMME Admin"
        }
    }

    signingConfigs {
        release {
            // Decoded from the ANDROID_KEYSTORE_BASE64 secret by the GitHub workflow; never committed.
            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "../homme-release.p12")
            storeType "pkcs12"
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias "homme"
            keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without the signing secret (e.g. a test build) fall back to the debug key.
            signingConfig System.getenv("ANDROID_KEYSTORE_PASSWORD") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
